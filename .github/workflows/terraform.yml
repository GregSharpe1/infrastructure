name: "Terraform CI/CD"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      terraform_directory:
        description: 'Directory containing Terraform files'
        required: true
        default: 'terraform/cloud/grafana/'
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    env:
      # Set your environment variables here. For example:
      TF_VAR_grafana_cloud_access_policy_token: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}
      TF_VAR_slack_infrastructure_alerts_webhook_url: ${{ secrets.SLACK_INFRASTRUCTURE_ALERTS_WEBHOOK_URL }}
      TF_VAR_slack_webhook_testing_webhook_url: ${{ secrets.SLACK_WEBHOOK_TESTING_WEBHOOK_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_CMD: terraform -chdir=${{ github.event.inputs.terraform_directory || 'terraform/cloud/grafana' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.5

      - name: Terraform Format
        id: fmt
        run: ${{ env.TF_CMD }} fmt -check

      - name: Terraform Init
        id: init
        run: ${{ env.TF_CMD }} init

      - name: Terraform Validate
        id: validate
        run: ${{ env.TF_CMD }} validate -no-color

      - name: Terraform Plan
        id: plan
        run: ${{ env.TF_CMD }} plan -no-color

      - name: Update Pull Request
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # - name: Terraform Apply
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   run: ${{ env.TF_CMD }} apply -auto-approve
